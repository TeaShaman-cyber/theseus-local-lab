name: Theseus Local Lab QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: theseus-local-lab-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: Repository-owned QA gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identity
        env:
          VERIFICATION_PROFILE: local-lab-qa
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$EXPECTED_SHA" ]]; then
            printf 'QA_SOURCE_MISMATCH expected=%s observed=%s\n' "$EXPECTED_SHA" "$checkout_sha" >&2
            exit 2
          fi
          {
            echo '## Verification identity'
            echo
            echo '```'
            printf 'verification_profile=%s\n' "$VERIFICATION_PROFILE"
            printf 'verification_event_repository=%s\n' "$EVENT_REPOSITORY"
            printf 'verification_event_sha=%s\n' "$EVENT_SHA"
            printf 'verification_source_repository=%s\n' "$SOURCE_REPOSITORY"
            printf 'verification_source_sha=%s\n' "$EXPECTED_SHA"
            printf 'verification_checkout_sha=%s\n' "$checkout_sha"
            printf 'verification_run_id=%s\n' "$RUN_ID"
            printf 'verification_run_attempt=%s\n' "$RUN_ATTEMPT"
            printf 'verification_caller_workflow_ref=%s\n' "$WORKFLOW_REF"
            printf 'verification_caller_workflow_sha=%s\n' "$WORKFLOW_SHA"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Verify pinned Node.js runtime
        run: |
          set -euo pipefail
          actual_node="$(node -p 'process.versions.node')"
          expected_node="$(tr -d '\r\n' < .nvmrc)"
          printf 'QA_RUNTIME node=v%s expected=v%s\n' "$actual_node" "$expected_node"
          [[ "$actual_node" == "$expected_node" ]]

      - name: Validate the repository QA endpoint
        env:
          QA_ENDPOINT: tools/dev/check
        run: |
          set -euo pipefail
          if [[ ! -f "$QA_ENDPOINT" ]]; then
            printf 'QA_ENDPOINT_MISSING path=%s\n' "$QA_ENDPOINT" >&2
            exit 2
          fi
          if [[ ! -s "$QA_ENDPOINT" ]]; then
            printf 'QA_ENDPOINT_EMPTY path=%s\n' "$QA_ENDPOINT" >&2
            exit 2
          fi
          printf 'QA_ENDPOINT_OK path=%s bytes=%s\n' "$QA_ENDPOINT" "$(wc -c <"$QA_ENDPOINT")"

      - name: Run the repository QA gate
        run: bash tools/dev/check

      - name: Publish QA receipt
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Deliberately no `set -e`/`pipefail`: writing the receipt must never
          # be able to fail an otherwise-green gate. This mirrors the canonical
          # currentness-witness pattern (check under `set +e`, write, then exit rc).
          set -u
          {
            echo '## QA receipt'
            echo
            echo '```'
            printf 'result=%s\n' "$JOB_RESULT"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'run_id=%s attempt=%s\n' "$RUN_ID" "$RUN_ATTEMPT"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
