# Как писать и как проверять: машинночитаемый набор.
# Источник: AGENTS.md, секции Prompt Hygiene, Documentation, Model And Harness Calibration.
revision: 2026-10-28-authoring-v1
source: docs/reference/authoring.md
rules:
  - id: AUT-001
    obligation: MUST
    statement: Промпты, скиллы и описания задач держать сухими — результат, ограничения, критерии успеха, условия остановки и требования проверки вместо длинных процедурных скриптов.
    verification: Перечитать текст; убрать всё, что не меняет поведение.

  - id: AUT-002
    obligation: MUST
    statement: Сохранять настоящие инварианты — безопасность, границы доступа, политику секретов, обязательные поля, правила маршрутизации и проверочные ворота.
    verification: Сверить с чек-листом инвариантов перед сокращением текста.

  - id: AUT-003
    obligation: MUST
    statement: Удалять дублирующие стилевые правила, инертные примеры, устаревшие привычки моделей и инструкции для уже надёжного поведения.
    verification: Для каждого правила найден случай, который оно предотвращает.

  - id: AUT-004
    obligation: MUST
    statement: Перед повышением усилия рассуждения, добавлением советника или расширением доступа к инструментам проверить наличие критерия успеха, правила зависимости, маршрута инструмента и цикла проверки.
    verification: Назвать, чего именно не хватает в задаче, до расширения ресурсов.

  - id: AUT-005
    obligation: MUST
    statement: Для работы с документацией начинать с docs/plans/documentation_audit.md и строить карту прежде, чем переписывать крупные разделы.
    verification: Карта создана и показана до правок.

  - id: AUT-006
    obligation: MUST
    statement: Держать разделение документации по назначению — учебный проход, как сделать, справочник, объяснение.
    verification: У каждого нового документа назван один из четырёх типов.

  - id: AUT-007
    obligation: MUST
    statement: Для обычного поведения давать мягкое руководство — результат, контекст, критерии успеха, предпочтительный маршрут — оставляя выбор эффективного пути.
    verification: Текст описывает результат, а не пошаговый сценарий.

  - id: AUT-008
    obligation: MUST
    statement: Жёсткие границы держать явными — секреты, доступ, внешние записи, разрушительные и дорогие действия, расширение области.
    verification: Каждая граница сформулирована запретом, а не пожеланием.

  - id: AUT-009
    obligation: MUST
    statement: Любое указание по семейству моделей считать базовой линией; каждую смену модели или харнесса перепроверять на представительных задачах с замером вызовов, контекста, задержки, побочных эффектов и результатов проверок.
    verification: Для смены модели есть замер до и после.

  - id: AUT-010
    obligation: MUST
    statement: Внешний совет классифицировать как официальный, наблюдаемый или гипотезу до превращения в правило проекта.
    verification: У каждого правила-источника указан класс.
