# Операции: машинночитаемый набор.
# Источник: docs/reference/operations.md и раздел «Операции» в AGENTS.md.
revision: 2026-10-30-operations-v2
source: docs/reference/operations.md
rules:
  - id: OPS-001
    obligation: MUST
    statement: Выбор инструмента идёт от задачи — сначала нативный CLI, если он есть; MCP только когда даёт то, чего у CLI нет, и без постоянного экспонирования шумных серверов; VS Code tasks, WSL и небольшие проверенные хелперы равноправны; длинные команды PowerShell — последнее средство.
    verification: Для выбранного пути названо, почему не подошёл более простой; в истории нет длинных PowerShell-однострочников без причины.

  - id: OPS-002
    obligation: MUST
    statement: Считать Hermes terminal, обычного пользователя Windows, Docker Desktop, WSL, VS Code и виртуальные машины разными контекстами, пока исполнение не доказало обратное.
    verification: Перед действием назван контекст, в котором оно выполняется.

  - id: OPS-003
    obligation: MUST
    statement: Для Docker и наблюдаемости использовать существующие узкие инструменты — tools/tool_policy, tools/session_timeline, tools/harness_errors, tools/memory_hook, log-lattice, backup-lattice.
    verification: Назван конкретный инструмент вместо самодельной команды.

  - id: OPS-004
    obligation: MUST
    statement: Считать %HERMES_HOME%/config.yaml, plugin selection и skill selection защищёнными границами активного профиля; менять их только штатным Hermes CLI.
    verification: Изменение выполнено командой Hermes, а не прямой правкой файла или registry.

  - id: OPS-005
    obligation: MUST
    statement: Для плагинов сначала использовать hermes plugins; для настроек hermes config set; для скиллов hermes skills config или проверенный config fallback, если интерактивный маршрут недоступен.
    verification: В логе есть штатная команда или явно объяснённый fallback.

  - id: OPS-006
    obligation: MUST
    statement: После изменения читать обратно точную цель через hermes config get, hermes plugins list или hermes skills list; успешный exit code без read-back не доказывает результат.
    verification: В логе есть вывод соответствующей команды чтения.

  - id: OPS-007
    obligation: MUST
    statement: Провал предпроверки не меняет активный профиль; после частичного изменения восстанавливается предыдущее явно прочитанное значение и выполняется повторный read-back.
    verification: После сбоя показано восстановленное значение.

  - id: OPS-008
    obligation: MUST
    statement: Если штатный менеджер заблокирован, назвать причину и использовать только узкий проверяемый fallback, сохраняющий тот же профиль и семантику; fallback не становится маршрутом по умолчанию.
    verification: Причина и границы fallback зафиксированы рядом с результатом.

  - id: OPS-009
    obligation: MUST_NOT
    statement: Редактировать config.yaml, plugin registry или skill registry вручную.
    verification: Изменения проходят только через Hermes CLI.
