      dry_run_extract: timeout_due_existing_Nemotron_backlog_not_retried
      old_backlog: preserved_no_memory_or_operation_deletion
    secrets: external-not-in-registry
    notes: Compose source and container provenance are now repository-owned; OAuth remains in the dedicated named volume and runtime env remains at D:/hindsight/.env. Current Nous Solar data-plane probing is blocked by Cloudflare error 1010; this is separate from source ownership and must not be reported as a healthy completion route. Cold-boot verification remains pending.

