    auth_volume: theseus-hermes-proxy-data
    service_name: hermes-proxy
    containers: [hermes-proxy]
    role: Nous OAuth credential broker for Hindsight Solar route
    owner: docker-engine
    lifecycle: docker-compose-restart-unless-stopped
    desktop_dependency: false
    host_startup_requirement: Docker Engine must be running; no Hermes Desktop ownership
    host_port_publication: false
    auth_boundary: dedicated-persistent-Hermes-profile
    credential_policy: no-static-key-in-compose-or-registry; no-Desktop-auth-json-bind-mount
    recovery: proxy-fault-recovery-verified; Docker Engine cold-boot still pending
    tracking_issue: https://github.com/TeaShaman-cyber/theseus-local-lab/issues/2
    audit:
      compose_definition: applied_and_config_valid
      container_runtime: verified_running
      dedicated_auth_profile: verified_named_volume_mode600
