    route: hermes -> codex_app_server -> native Codex applications
    services: [gmail, google-drive]
    deferred_services: [google-calendar]
    secret_policy: external-not-in-registry
    recovery: manual-runtime-config-rollback
    rollback: Restore model.openai_runtime to auto through the Hermes runtime switcher.
    audit:
      configured_at: 2026-08-28
      hermes_runtime: codex_app_server
      codex_launcher: C:/Users/s.poklad/AppData/Roaming/npm/codex.cmd
      codex_initialize: verified
      codex_thread_start: verified
