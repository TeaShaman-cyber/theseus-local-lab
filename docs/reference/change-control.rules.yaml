# Change control: машинночитаемый набор.
# Источник: AGENTS.md, секция Project Change Control (MarcoPolo project-settings v9).
# Проверяется через tools/contracts/check_rules.py.
revision: 2026-10-28-change-control-v1
source: docs/reference/change-control.md
rules:
  - id: CHG-001
    obligation: MUST
    statement: Канонический источник контракта — TeaShaman-cyber/marcopolo-cookbook/project/project-contract.wl; настройки проекта в ChatGPT являются проекцией, а не источником истины.
    verification: Открыть файл контракта в репозитории и сверить ревизию.

  - id: CHG-002
    obligation: MUST
    statement: Проекция считается актуальной только после того, как проба PROJECT_CONTRACT_PROBE вернула PC_OK_V9.
    verification: Выполнить пробу и получить ожидаемый ответ.

  - id: CHG-003
    obligation: MUST_NOT
    statement: Считать мерж доказательством того, что проекция установлена в рантайме.
    verification: Мерж проверяется по git, проекция — только пробой.

  - id: CHG-004
    obligation: MUST
    statement: Для собственных репозиториев использовать ограниченный цикл Issue -> область и доказательства -> атомарное изменение -> точечная проверка -> ревью и чтение обратно -> локальный чекпойнт -> рутинное продвижение.
    verification: В задаче видны все шаги цикла до чекпойнта.

  - id: CHG-005
    obligation: MUST
    statement: Создать или переиспользовать одну узкую задачу до новой линии исследования, устойчивого архитектурного решения, долговременной автоматизации, сквозного изменения репозитория или инфраструктуры либо изменения уровня проекта в маршрутизации, полномочиях, правах, персистентности, канонических источниках, верификации или приёмке.
    verification: Номер задачи назван до первого изменения в коде.

  - id: CHG-006
    obligation: MUST
    statement: Каждый шаг реализации обратим, обозрим и ограничен одним очевидным следующим действием.
    verification: Diff одного шага помещается в одну ревью-сессию и имеет путь отката.

  - id: CHG-007
    obligation: MUST_NOT
    statement: Рассматривать задачу как полномочие на посторонние репозитории, релизы, публикацию или изменение защищённых границ.
    verification: Объём задачи сверен с фактическими действиями.

  - id: CHG-008
    obligation: MUST
    statement: Рутинное продвижение в собственном репозитории допустимо только при неизменной области, проверенной актуальности базовой ветки и точного head, пройденных обязательных проверках и ревью, отсутствии P0/P1 и при непресечении защищённых границ.
    verification: Перечислены все условия и каждое подтверждено выводом команды.

  - id: CHG-009
    obligation: MAY
    statement: Новая задача не нужна для правок только формулировок, механического обслуживания без влияния на поведение и полномочия либо работы, уже покрытой открытой задачей.
    verification: Изменение не затрагивает поведение, полномочия и канонические источники.

  - id: CHG-010
    obligation: MUST
    statement: В задаче, PR или чекпойнте зафиксировать мотивацию, предполагаемый инвариант, точные файлы и область, команды и результаты проверок, доказательства актуальности и чтения обратно, путь отката и итоговое решение.
    verification: Тело задачи или коммита содержит все семь пунктов.

  - id: CHG-011
    obligation: MUST
    statement: Различать состояния возможности — CONFIGURED, EXPOSED, AVAILABLE, INVOKED, COMPLETED, VERIFIED.
    verification: В отчёте названо, какое именно состояние достигнуто.

  - id: CHG-012
    obligation: MUST_NOT
    statement: Выводить работоспособность из документации, кешированного состояния, видимости, факта аутентификации или самоотчёта исполнителя.
    verification: Для каждого утверждения о работе есть наблюдаемое следствие.

  - id: CHG-013
    obligation: MUST
    statement: Заявлять успех только после наблюдаемого пост-условия.
    verification: Назван конкретный наблюдаемый признак и команда, которая его показала.

  - id: CHG-014
    obligation: MUST
    statement: Для восстановления прошлых чатов, веток и решений предпочитать исторические доказательства MarcoPolo и Session Search; встроенный поиск — только как раскрытый фолбэк.
    verification: В ответе указан использованный маршрут; при фолбэке он назван явно.

  - id: CHG-015
    obligation: MUST
    statement: Держать раздельно исходники проекта, рантайм-проекцию, исторические доказательства, семантическую и эпизодическую память и операционное состояние.
    verification: Каждое утверждение отнесено к своему слою.

  - id: CHG-016
    obligation: MUST
    statement: Важные записи требуют чтения обратно.
    verification: После записи выполнено чтение и показано фактическое содержимое.
