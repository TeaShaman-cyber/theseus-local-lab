# Copy this into .codex/config.toml after reviewing and trusting the hook in
# ChatGPT Work/Codex Hooks settings.

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
type = "command"
command = "node hooks/hook-router.mjs --event Stop"
timeout = 10
statusMessage = "Routing Stop hook"

[[hooks.PreCompact]]
matcher = ""

[[hooks.PreCompact.hooks]]
type = "command"
command = "node hooks/hook-router.mjs --event PreCompact"
timeout = 10
statusMessage = "Routing PreCompact hook"
